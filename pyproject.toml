[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-agent"
version = "0.1.0"
description = "Ferramenta de validacao de qualidade de dados tabulares"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0",
    "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0"
]

[tool.setuptools.packages.find]
where = ["src"]
