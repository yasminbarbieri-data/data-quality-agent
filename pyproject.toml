[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-agent"
version = "1.0.0"
description = "Diagnóstico, correções determinísticas auditáveis e análise assistida da qualidade de dados"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "openpyxl>=3.1",
    "streamlit>=1.65"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0"
]

[tool.setuptools.packages.find]
where = ["src"]
